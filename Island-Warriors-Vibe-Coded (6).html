        html {
          margin:0; padding:0; background:#0a0a0a;
          overflow-x:hidden;
          scroll-behavior: smooth;
          scroll-padding-top: 0;
        }
        body { margin:0; padding:0; background:#0a0a0a; overflow-x:hidden; padding-top:0; }
        * { box-sizing: border-box; }
        img { max-width:100%; display:block; }
        section, footer { isolation: isolate; position: relative; margin:0; padding:0; overflow-x:clip; }

        /* HERO GOLD MASTER - dimensional ratios from provided assets */
        #hero {
          position: relative;
          width: 100%;
          height: 100svh;
          min-height: 700px;
          max-height: 960px;
          background-color: #0a0a0a;
          margin:0;
          padding:0;
          display:flex;
          align-items:flex-end;
          justify-content:center;
          padding-bottom: 120px;
          overflow:hidden;
          isolation:isolate;
        }
        /* subtle leather vignette + gradient for CTA readability, not covering logo */
        #hero::before {
          content:'';
          position:absolute;
          inset:0;
          background: 
            radial-gradient(80% 65% at 50% 42%, transparent 58%, rgba(10,10,10,0.35) 86%),
            linear-gradient(180deg, rgba(10,10,10,0.08) 0%, rgba(10,10,10,0.15) 55%, rgba(10,10,10,0.92) 100%);
          z-index:1;
        }
        @media (max-width:768px) {
          #hero {
            padding-bottom: 80px;
            min-height: 740px;
          }
        }
        #hero .hero-content { position:relative; z-index:2; isolation:isolate; width:100%; }
        #hero-bg-img {
          position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; display:block; z-index:0;
        }
        @media (max-width:768px){ #hero-bg-img{ object-position:center top; } }

        #who { z-index:2; background:#f5f2ed; }
        #mission { z-index:2; background:#f5f2ed; }
        #vision { z-index:3; background:#0a0a0a; }
        #what { z-index:4; background:#0a0a0a; }
        #founders { z-index:5; background:#f5f2ed; }
        #relations { z-index:6; background:#0a0a0a; }
        #commitment { z-index:7; background:#f5f2ed; }
        #contact { z-index:8; background:#0a0a0a; }
        footer { z-index:9; background:#080808; }
        .menu-item { opacity:0; transform: translateY(22px); transition: opacity 0.6s cubic-bezier(.16,1,.3,1), transform 0.6s cubic-bezier(.16,1,.3,1); }
        .menu-open .menu-item { opacity:1; transform: translateY(0); }
